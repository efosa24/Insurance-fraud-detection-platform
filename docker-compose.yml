version: '3.8'

services:
  # FastAPI Backend Service
  fraud-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fraud-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - MODEL_PATH=/app/app/artifacts/model.pkl
      - PIPELINE_PATH=/app/app/artifacts/pipeline.pkl
    volumes:
      - ./app:/app/app
      - ./app/artifacts:/app/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # Streamlit Frontend Service
  fraud-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: fraud-dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://fraud-api:8000
      - LOG_LEVEL=INFO
    volumes:
      - ./app/frontend:/app/app/frontend
      - ./app/artifacts:/app/app/artifacts
    depends_on:
      fraud-api:
        condition: service_healthy
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # Optional: Nginx Reverse Proxy (for production)
  # nginx:
  #   image: nginx:alpine
  #   container_name: fraud-proxy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - fraud-api
  #     - fraud-dashboard
  #   networks:
  #     - fraud-detection-network
  #   restart: unless-stopped

networks:
  fraud-detection-network:
    driver: bridge

volumes:
  artifacts:
    driver: local